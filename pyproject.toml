[project]
name = "xiliumini"
version = "0.1.0"
description = "A minimal, local-first Agent CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "langchain-core>=0.3,<2",
  "langchain-openai>=0.3,<2",
  "langgraph>=0.4,<2",
  "pydantic-settings>=2.7,<3",
  "python-dotenv>=1.0,<2",
  "rich>=13.9,<15",
  "tzdata>=2025.2; sys_platform == 'win32'",
  "typer>=0.15,<1",
]

[project.scripts]
xiliumini = "xiliumini.cli:app"

[dependency-groups]
dev = [
  "pyright>=1.1,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xiliumini"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
